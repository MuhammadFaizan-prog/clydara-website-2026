name: Daily discovery accessibility monitor
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public discovery resources and simulated search crawler access
        run: node scripts/discovery-check.mjs
      - name: Preserve dated checks even when accessibility fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-accessibility
          path: seo/evidence/discovery-http.json
          retention-days: 30
